<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Minansi ❤️</title>
    <style>
        body {
            background-color: #fff0f3; /* Soft Pink */
            font-family: 'Arial', cursive;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }

        h1 {
            color: #ff4d6d;
            text-shadow: 2px 2px #ffb3c1;
            margin-bottom: 10px;
        }

        /* Container for the photo display */
        #display-area {
            width: 90%;
            max-width: 350px;
            height: 400px;
            margin: 20px 0;
            border: 8px solid #ff4d6d;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: white;
            box-shadow: 0 10px 20px rgba(255, 77, 109, 0.3);
            position: relative;
        }

        #display-area img {
            max-width: 100%;
            max-height: 100%;
            display: none; 
            object-fit: cover;
            animation: heartPop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes heartPop {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .instruction {
            color: #ff758f;
            font-style: italic;
            text-align: center;
            padding: 20px;
        }

        /* Button Layout */
        .button-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            max-width: 400px;
        }

        .cute-btn {
            padding: 12px 20px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 0px rgba(0,0,0,0.1);
        }

        .cute-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 10px rgba(255, 77, 109, 0.2);
        }

        .cute-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        /* Unique Button Styles */
        .btn-1 { background: #ffb3c1; color: #590d22; border-radius: 50px; } /* Oval */
        .btn-2 { background: #ff85a1; color: white; border-radius: 0 20px 0 20px; } /* Leaf shape */
        .btn-3 { background: #ff4d6d; color: white; border-radius: 20px 0 20px 0; } /* Inverse leaf */
        .btn-4 { background: #c9184a; color: white; border-radius: 10px; border: 2px solid white; } /* Framed */

        .error-message {
            color: #ff4d6d;
            text-align: center;
            margin-top: 10px;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <h1>For Minansi ❤️</h1>

    <div id="display-area">
        <img id="photo" src="" alt="Memory">
    </div>

    <p class="instruction">Click a button to see a memory! 📸✨</p>

    <div class="button-grid">
        <button class="cute-btn btn-1" onclick="showPhoto(0)">Memory 1</button>
        <button class="cute-btn btn-2" onclick="showPhoto(1)">Memory 2</button>
        <button class="cute-btn btn-3" onclick="showPhoto(2)">Memory 3</button>
        <button class="cute-btn btn-4" onclick="showPhoto(3)">Memory 4</button>
    </div>

    <p id="error" class="error-message"></p>

    <script>
        const memories = [
            'https://i.ibb.co/S4C3grM.jpg',
            'https://i.ibb.co/27dBbqD.jpg',
            'https://i.ibb.co/0Vt1TnK.jpg',
            'https://i.ibb.co/7tYXgpT4.jpg'
        ];

        function showPhoto(index) {
            const photoElement = document.getElementById('photo');
            const errorElement = document.getElementById('error');
            
            photoElement.style.display = 'none';
            errorElement.textContent = '';
            
            setTimeout(() => {
                const img = new Image();
                
                img.onload = function() {
                    photoElement.src = memories[index];
                    photoElement.style.display = 'block';
                };
                
                img.onerror = function() {
                    errorElement.textContent = '❌ Image failed to load. Please check the image URL.';
                    console.log('Failed to load:', memories[index]);
                };
                
                img.src = memories[index];
            }, 100);
        }
    </script>

</body>
</html>
